---
name: Vulnerability Suppression Check

on:
  schedule:
    # Weekly on Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check-suppressions:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-vuln-suppression-check.yml@8a6b1f553f1a0400a70db8910094073ce803cc4d # v0.69.5
    with:
      job-name: '🔍 Suppression Staleness Check'
      workflow-file: vuln-suppression-check.yml
      runner-image: ubuntu-24.04
      tooling-ref: '8a6b1f553f1a0400a70db8910094073ce803cc4d' # v0.69.5
      egress-policy: block
      egress-preset: osv-scanner
    permissions:
      contents: write
      pull-requests: write
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
