---
name: Quality Check - Action Pinning Validation

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36 # v0.69.8
    with:
      runner-image: ubuntu-24.04
      tooling-ref: 'f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36' # v0.69.8
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
