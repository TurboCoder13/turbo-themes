---
name: Quality Check - Action Pinning Validation

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@f2b35cdad10df33b60c2996570b3848b70f55ed1 # v0.69.7
    with:
      runner-image: ubuntu-24.04
      tooling-ref: 'f2b35cdad10df33b60c2996570b3848b70f55ed1' # v0.69.7
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
