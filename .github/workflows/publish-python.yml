---
name: Publish Python Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish-python:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        if: ${{ !env.ACT }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github-releases.githubusercontent.com:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            upload.pypi.org:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version sync
        run: ./scripts/ci/validate-version-sync.sh

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          node-version: 22
          skip-ruby: true

      - name: Build JS + generate types
        run: bun run build && bun run generate:all

      - name: Test Python package
        run: ./scripts/ci/test-python-package.sh

      - name: Build Python package
        run: ./scripts/ci/build-python-package.sh

      - name: Publish to PyPI (trusted publishing)
        working-directory: python
        run: uv publish
